<svg xmlns="http://www.w3.org/2000/svg" width="880" height="110" viewBox="0 0 880 110" role="img" aria-labelledby="title desc">
<title id="title">What I&#x27;m building (light)</title><desc id="desc">Section title</desc>
<style>
@font-face{font-family:Instrument Serif;src:url(data:font/woff;base64,) format("woff");}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate{animation: rise .75s cubic-bezier(.22,1,.36,1) both;animation-delay:1.50s}
@media (prefers-reduced-motion:reduce){.animate{animation:none!important}}
</style>
<rect width="880" height="110" rx="20" fill="#f4f1ed"/>
<text class="animate" x="44" y="78" fill="#171517" font-family="Instrument Serif" font-size="58">What I&apos;m building</text>
</svg>
