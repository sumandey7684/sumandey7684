name: Refresh profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql \
            -f query='query($login:String!) {
              user(login:$login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays { contributionCount date weekday }
                    }
                  }
                }
              }
            }' \
            -f login='${{ github.repository_owner }}' \
            --jq '.data.user.contributionsCollection' > data/contributions.json
      - name: Prepare renderer
        run: |
          python -m pip install --disable-pip-version-check fonttools
          mkdir -p fonts
          curl -L --fail --retry 3 \
            -o fonts/Outfit-Variable.ttf \
            https://github.com/google/fonts/raw/main/ofl/outfit/Outfit%5Bwght%5D.ttf
      - name: Render SVG cards
        run: python scripts/render_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
